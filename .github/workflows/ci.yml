name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: "check: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: oxc, cmd: pnpm check }
          - { name: type-safety, cmd: pnpm typecheck }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.cmd }}

  changeset:
    name: "check: changeset"
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - run: node packages/claude-rules/scripts/check-changeset.ts origin/${{ github.base_ref }}

  tests:
    name: "tests: ${{ matrix.os }}"
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm -r --filter "./packages/**" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - name: Package contents
        run: |
          for pack in "$RUNNER_TEMP"/packs/*.tgz; do
            echo "### $(basename "$pack")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tar -tzf "$pack" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  docs:
    name: docs
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  ci:
    name: ci
    needs: [checks, changeset, tests, build, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded, or was skipped on purpose
        run: |
          echo '${{ toJSON(needs) }}' | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const failed = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result));
            for (const [name, job] of failed) console.error(`${name}: ${job.result}`);
            process.exit(failed.length === 0 ? 0 : 1);
          '
